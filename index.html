<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <script>
    const form = document.getElementById("contactForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault(); // stop normal page reload

      const formData = new FormData(form);

      try {
        await fetch("/", {
          method: "POST",
          body: formData,
        });

        alert("Thank you! Your message has been sent."); // popup
        form.reset(); // clear fields
      } catch (error) {
        alert("Oops! Something went wrong. Please try again.");
      }
    });
  </script>
  <body>
    <section class="section__container contact__container" id="contact">
      <p class="section__subheader"></p>
      <h2 class="section__header">Questions or <span>Feedback?</span></h2>
      <p class="section__description">
        We’d love to hear your thoughts about AuthVenture and how we can spread
        MFA awareness better.
      </p>

      <form name="contact" method="POST" data-netlify="true">
        <input type="text" name="User-name" placeholder="Name" required />
        <input type="email" name="User-email" placeholder="Email" required />
        <textarea name="message" placeholder="Message" required></textarea>
        <button class="btn" type="submit">Submit Message</button>
      </form>
    </section>
  </body>
</html>
