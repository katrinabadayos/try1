<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="section__container contact__container" id="contact">
      <p class="section__subheader"></p>
      <h2 class="section__header">Questions or <span>Feedback?</span></h2>
      <p class="section__description">
        We’d love to hear your thoughts about AuthVenture and how we can spread
        MFA awareness better.
      </p>

      <form name="contact" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="contact" />

        <input type="text" name="name" placeholder="Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <textarea name="message" placeholder="Message" required></textarea>
        <button class="btn" type="submit">Submit Message</button>
        <p id="form-message">Thank you! Your message has been sent.</p>
      </form>
    </section>
  </body>
</html>
